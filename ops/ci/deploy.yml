# STARTER — completed in Phase D9. Place at .github/workflows/deploy.yml when ready.
# Represents the required shape: nothing reaches production without tests, scans,
# a signed image and a logged human approval.

name: build-test-deploy

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false        # never cancel a deploy mid-flight

permissions:
  contents: read
  packages: write
  id-token: write                  # keyless signing

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: test, POSTGRES_DB: vge_test }
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # full history for secret scanning
      - name: Lint
        run: ruff check . && black --check .
      - name: Type check
        run: mypy --strict src/
      - name: Unit tests
        run: pytest tests/unit --cov --cov-fail-under=85
      - name: Integration tests
        run: pytest tests/integration
      - name: Security scans
        run: |
          bandit -r src/
          pip-audit
          gitleaks detect --no-git -v

  build:
    needs: quality
    if: github.ref == 'refs/heads/main'
